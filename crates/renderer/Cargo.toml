[package]
name = "renderer"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
dom = { workspace = true }
# Exactly html5ever 0.39's own markup5ever; same pin as dom's charter, so
# parser QualNames flow into dom as one type, no conversion layer.
markup5ever = "=0.39.0"
html5ever = "=0.39.0"
tendril = "0.5"
encoding_rs = "0.8"
# Web Crypto entropy must come from the operating system, never the JS PRNG.
getrandom = "0.4"
# ECMA-402 formatting uses a locale-filtered ICU4X blob generated for the
# supported locale set; compiled_data would retain every CLDR locale.
fixed_decimal = { version = "0.7.2", features = ["ryu"] }
icu_calendar = { version = "2.3.0", default-features = false }
icu_datetime = { version = "2.3.0", default-features = false, features = ["serde"] }
icu_decimal = { version = "2.3.0", default-features = false, features = ["alloc", "ryu", "serde"] }
icu_experimental = { version = "0.6.0", default-features = false, features = ["ryu", "serde"] }
icu_locale = { version = "2.3.1", default-features = false, features = ["serde"] }
icu_locale_core = "2.3.0"
icu_provider = { version = "2.3.1", default-features = false }
icu_provider_adapters = { version = "2.3.0", features = ["serde"] }
icu_provider_blob = { version = "2.3.0", features = ["alloc"] }
writeable = "0.6"
# The engine waits on nothing itself: `time` for timer deadlines, `sync` for
# the wake handle, `macros` for `select!`. A carrier brings its own runtime.
tokio = { version = "1.53", default-features = false, features = ["time", "sync", "macros"] }
url = "2"
# QuickJS-ng via rquickjs; `std` uses shipped linux bindings (no bindgen).
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "classes", "loader", "macro"] }
# Value-only seam for script results crossing to a carrier.
serde = { version = "1", features = ["derive"] }
# Style / layout / paint.

app_units = "0.7"
euclid = "0.22"
fontique = { version = "0.11", default-features = false }
parley = { version = "0.11", default-features = false, features = ["libm"] }
png = "0.18"
selectors = "0.40"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
web_atoms = "0.2"
style = { package = "stylo", version = "0.21" }
stylo_dom = "0.21"
stylo_static_prefs = "0.21"
style_traits = { package = "stylo_traits", version = "0.21" }
taffy = "0.14"
tiny-skia = "0.12"

[dev-dependencies]
# The value seam's non-finite encoding is asserted in protocol tests.
serde_json = "1"
