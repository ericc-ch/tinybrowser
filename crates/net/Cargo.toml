[package]
name = "net"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-tls = { version = "0.6", features = ["alpn"] }
hyper-util = { version = "0.1", features = ["client-legacy", "client-proxy", "http1", "http2", "tokio"] }
native-tls = { version = "0.2", features = ["alpn"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
tokio-native-tls = "0.3"
thiserror = "2"
tokio = { version = "1.53", default-features = false, features = ["net", "time", "io-util", "rt"] }
tower-service = "0.3"
async-compression = { version = "0.4", features = ["tokio", "gzip", "deflate", "zlib", "brotli"] }
cookies = { workspace = true }
enumerated = { workspace = true }
secure-context = { workspace = true }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
flate2 = "1"
tokio = { version = "1.53", default-features = false, features = ["rt", "macros"] }
