[package]
name = "net"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-tls = { version = "0.6", features = ["alpn"] }
hyper-util = { version = "0.1", features = ["client-legacy", "client-proxy", "http1", "http2", "tokio"] }
native-tls = { version = "0.2", features = ["alpn"] }
tokio-native-tls = "0.3"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "native-tls"] }
tower-service = "0.3"
tinybrowser-cookie = { workspace = true }
url = "2"

[dev-dependencies]
tungstenite = "0.29"
