[package]
name = "browser"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
dom = { workspace = true }
net = { workspace = true }
# Exactly html5ever 0.39's own markup5ever; same pin as dom's charter, so
# parser QualNames flow into dom as one type, no conversion layer.
markup5ever = "=0.39.0"
html5ever = "=0.39.0"
tendril = "0.5"
# Page thread waiter: current-thread `rt`+`time`+`macros` (`macros` for `select!` only).
tokio = { version = "1.53", default-features = false, features = ["rt", "time", "macros"] }
url = "2"
# QuickJS-ng via rquickjs; `std` uses shipped linux bindings (no bindgen).
rquickjs = { version = "0.12.2", default-features = false, features = ["std", "macro"] }
