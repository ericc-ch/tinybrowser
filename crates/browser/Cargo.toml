[package]
name = "browser"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
net = { workspace = true }
renderer = { workspace = true }
logging = { workspace = true }
# The renderer wire is serde-encoded JSON control plus raw body frames.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", default-features = false, features = ["rt", "sync", "time", "macros", "io-util", "net", "process"] }
url = "2"
