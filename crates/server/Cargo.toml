[package]
name = "server"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2"] }
serde_json = "1"
tokio = { version = "1.53", default-features = false, features = ["rt", "net", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
