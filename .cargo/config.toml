[env]
RUST_TEST_THREADS = "1"

# QuickJS-ng is the only C compiled in the graph (rquickjs-sys via cc). C
# unwind tables serve backtraces only: nothing unwinds (panic = "abort",
# setjmp instead of exceptions), so drop them (about 53 KB). Plain [env], no
# force, so an ambient CFLAGS still wins.
CFLAGS = "-fno-unwind-tables -fno-asynchronous-unwind-tables"

# Link-time size flags (lld, `--icf=all`, RELR, no `.eh_frame_hdr`) live in
# `build.rs` scoped to the release binary. They only shrink the shipping
# artifact, and keeping them off debug/test links avoids forcing LLD onto
# DWARF rustc 1.98.1 does not always emit LLD-compatible relocations for.
# See `docs/researches/size-budget.md`.

