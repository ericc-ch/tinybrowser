  .page{max-width:960px;margin:0 auto;padding:48px 28px 96px}
  h1{font-size:clamp(1.7rem,3.4vw,2.4rem);line-height:1.15;margin:0 0 10px;letter-spacing:-.02em}

  /* Mermaid blocks: scrollable inline, click to open the zoom overlay. */

    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  pre.mermaid svg{max-width:100% !important;height:auto}
  pre.mermaid::after{content:"click to zoom";position:absolute;top:8px;right:12px;
    font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity .15s;pointer-events:none}

  .zoom-stage.dragging{cursor:grabbing}
  .zoom-holder{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  .zoom-holder svg{display:block;max-width:none !important;height:auto}

  footer{margin-top:64px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}

<div class="page">
$body$
<footer>
  Source: <code>docs/architecture.md</code> · diagrams: Mermaid · rendered with
  pandoc by <code>tools/docs/build.sh</code>. When code and this page disagree,

<div class="zoom" id="zoom" hidden>
  <div class="zoom-bar">
    <button type="button" data-action="out" title="Zoom out">−</button>
    <button type="button" data-action="reset" title="Fit to screen (0)">Fit</button>
    <button type="button" data-action="in" title="Zoom in">+</button>
    <button type="button" data-action="close" title="Close (Esc)">×</button>
  </div>
  <div class="zoom-stage"><div class="zoom-holder"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js"></script>
<script>
  (function () {
    "use strict";

    if (!window.mermaid) {
      document.querySelectorAll("pre.mermaid").forEach(function (element) {
        element.insertAdjacentHTML(
          "beforebegin",
          '<p class="diagram-error">Mermaid failed to load (blocked network?). The diagram source follows.</p>'
        );
      });
      return;
    }

    var prefersDark = !!(
      window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
    );

    window.mermaid.initialize({
      startOnLoad: false,
      theme: prefersDark ? "dark" : "neutral",
      fontFamily: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif',
      fontSize: 15,
      themeVariables: { fontSize: "15px" },
    });

    var overlay = document.getElementById("zoom");
    var stage = overlay.querySelector(".zoom-stage");
    var holder = overlay.querySelector(".zoom-holder");
    var scale = 1;
    var tx = 0;
    var ty = 0;
    var drag = null;
    var startX = 0;
    var startY = 0;
    var moved = false;

    function apply() {
      holder.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
    }

    function fit() {
      var child = holder.firstElementChild;
      if (!child) return;
      var width = child.offsetWidth || 1;
      var height = child.offsetHeight || 1;
      var availableWidth = stage.clientWidth - 64;
      var availableHeight = stage.clientHeight - 64;
      scale = Math.max(0.1, Math.min(1.2, availableWidth / width, availableHeight / height));
      tx = (stage.clientWidth - width * scale) / 2;
      ty = (stage.clientHeight - height * scale) / 2;
      apply();
    }

    function zoomAt(positionX, positionY, factor) {
      var next = Math.max(0.15, Math.min(8, scale * factor));
      var ratio = next / scale;
      tx = positionX - ratio * (positionX - tx);
      ty = positionY - ratio * (positionY - ty);
      scale = next;
      apply();
    }

    function openZoom(element) {
      var svg = element.querySelector("svg");
      if (!svg) return;
      var clone = svg.cloneNode(true);
      clone.removeAttribute("style");
      clone.removeAttribute("width");
      clone.removeAttribute("height");
      var viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width > 0) {
        clone.setAttribute("width", viewBox.width);
        clone.setAttribute("height", viewBox.height);
      } else {
        var rect = svg.getBoundingClientRect();
        clone.setAttribute("width", rect.width || 1200);
        clone.setAttribute("height", rect.height || 800);
      }
      holder.replaceChildren(clone);
      overlay.hidden = false;
      document.body.style.overflow = "hidden";
      requestAnimationFrame(fit);
    }

    function closeZoom() {
      overlay.hidden = true;
      holder.replaceChildren();
      document.body.style.overflow = "";
    }

    function wireZoom(element) {
      element.classList.add("zoomable");
      element.setAttribute("tabindex", "0");
      element.setAttribute("role", "img");
      element.setAttribute("title", "Click to zoom");
      element.addEventListener("click", function () {
        openZoom(element);
      });
      element.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openZoom(element);
        }
      });
    }

    overlay.addEventListener("click", function (event) {
      var button = event.target.closest("button[data-action]");
      if (button) {
        var action = button.getAttribute("data-action");
        if (action === "close") closeZoom();
        else if (action === "reset") fit();
        else if (action === "in") zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.3);
        else if (action === "out") zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1 / 1.3);
        event.stopPropagation();
        return;
      }
      if (event.target === overlay || event.target === stage) {
        // A drag also ends in a click on the stage; only a motionless click closes.
        if (moved) {
          moved = false;
        } else {
          closeZoom();
        }
      }
    });

    stage.addEventListener(
      "wheel",
      function (event) {
        event.preventDefault();
        var rect = stage.getBoundingClientRect();
        zoomAt(event.clientX - rect.left, event.clientY - rect.top, Math.exp(-event.deltaY * 0.0015));
      },
      { passive: false }
    );

    stage.addEventListener("pointerdown", function (event) {
      if (event.button !== 0) return;
      drag = { x: event.clientX - tx, y: event.clientY - ty };
      startX = event.clientX;
      startY = event.clientY;
      moved = false;
      if (stage.setPointerCapture) stage.setPointerCapture(event.pointerId);
      stage.classList.add("dragging");
    });
    stage.addEventListener("pointermove", function (event) {
      if (!drag) return;
      if (Math.abs(event.clientX - startX) > 4 || Math.abs(event.clientY - startY) > 4) {
        moved = true;
      }
      tx = event.clientX - drag.x;
      ty = event.clientY - drag.y;
      apply();
    });
    function endDrag() {
      drag = null;
      stage.classList.remove("dragging");
    }
    stage.addEventListener("pointerup", endDrag);
    stage.addEventListener("pointercancel", endDrag);

    document.addEventListener("keydown", function (event) {
      if (overlay.hidden) return;
      if (event.key === "Escape") closeZoom();
      else if (event.key === "+" || event.key === "=") zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.3);
      else if (event.key === "-") zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1 / 1.3);
      else if (event.key === "0") fit();
    });

    window.mermaid.run().then(function () {
      document.querySelectorAll("pre.mermaid").forEach(wireZoom);
    }).catch(function (error) {
      if (window.console) window.console.error("Mermaid render failed:", error);
    });
  })();
</script>
