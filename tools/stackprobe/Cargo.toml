[package]
name = "stackprobe"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "server-auto"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
sha1 = "0.10"
base64 = "0.22"
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[workspace]
