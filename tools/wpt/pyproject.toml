[project]
name = "tinybrowser-wpt"
version = "0.1.0"
description = "wptrunner product plugin for tinybrowser"
requires-python = ">=3.10"

[project.entry-points."wptrunner.products"]
tinybrowser = "tinybrowser_wpt:load"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["tinybrowser_wpt"]

[tool.ty.environment]
# patch_wpt imports upstream only after sys.path gains the WPT checkout at
# runtime; these paths let ty resolve the same modules statically.
extra-paths = [
    "../../third_party/wpt",
    "../../third_party/wpt/tools/wptrunner",
    "../../third_party/wpt/tools/wptserve",
]
