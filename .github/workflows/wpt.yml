# The full WPT suite on every push, in the engine process.
#
# Two lanes partition the manifest exactly:
#
#   harness   — testharness, crashtest, and reftest files mounted in the real
#               engine, with a wptserve sidecar for `.py` handler routes. No
#               WebDriver, wptserve request path, or renderer child per test.
#   webdriver — the files `fast-harness` cannot run: testdriver tests and the
#               generated worker/module wrappers, driven through the browser.
#
# `test262` runs natively in QuickJS in one job. The score job folds every
# report into one table. The nightly `wpt-nightly.yml` still runs the whole
# suite through WebDriver, which is the fidelity backstop.
#
# Cost: measured over the 11/9 split, the harness lane is ~74 chunk-minutes at
# 4 jobs and the WebDriver lane ~32 (it runs far fewer files but each one costs
# a browser round trip). The chunk counts below split the repository's 20-job
# limit in that ratio, so both lanes finish together. Re-measure before changing
# them: the balance, not the file count, is what sets the wall time.
name: WPT

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      harness-chunks:
        description: In-process chunk jobs; ~4 vCPUs each.
        type: string
        default: "14"
      webdriver-chunks:
        description: WebDriver chunk jobs; harness + WebDriver must total <= 20.
        type: string
        default: "6"
      test-types:
        description: Space-separated wptrunner test types; stays last (nargs).
        type: string
        default: "testharness crashtest reftest"
      exclude:
        description: Space-separated upstream --exclude values.
        type: string
        default: "worker"

permissions:
  contents: read

concurrency:
  # Newest run wins: a push supersedes the previous push's run, and a manual
  # dispatch supersedes whatever is in flight (waiting behind a run that is
  # itself cancelling left a dispatch idle for minutes).
  group: wpt-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  # Line tables keep panic and crash backtraces usable (file:line) at a
  # fraction of full debuginfo; the 14 GB runner disk stays comfortable.
  CARGO_PROFILE_WPT_DEBUG: "line-tables-only"
  # Mirrors the flake devShell: link the runner's OpenSSL instead of building
  # a vendored copy.
  OPENSSL_NO_VENDOR: "1"
  # Dispatch inputs are empty on pushes, so every use goes through these.
  WPT_HARNESS_CHUNKS: ${{ inputs.harness-chunks || '14' }}
  WPT_WEBDRIVER_CHUNKS: ${{ inputs.webdriver-chunks || '6' }}
  WPT_TEST_TYPES: ${{ inputs.test-types || 'testharness crashtest reftest' }}
  WPT_EXCLUDE: ${{ inputs.exclude || 'worker' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      harness: ${{ steps.plan.outputs.harness }}
      webdriver: ${{ steps.plan.outputs.webdriver }}
    steps:
      - id: plan
        name: Build the chunk lists
        run: |
          set -euo pipefail
          total=$(( WPT_HARNESS_CHUNKS + WPT_WEBDRIVER_CHUNKS ))
          if (( total > 20 )); then
            echo "::error::harness + webdriver chunks is $total; the repository limit is 20"
            exit 1
          fi
          echo "harness=[$(seq -s, 1 "$WPT_HARNESS_CHUNKS")]" >> "$GITHUB_OUTPUT"
          echo "webdriver=[$(seq -s, 1 "$WPT_WEBDRIVER_CHUNKS")]" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - name: WPT checkout (pinned, shallow)
        run: git submodule update --init --depth 1 third_party/wpt
      - uses: astral-sh/setup-uv@v10.3.0
      - name: WPT manifest (built once for every chunk)
        run: |
          python3 tools/wpt/cli.py manifest
          mkdir -p wpt-manifest
          cp third_party/wpt/MANIFEST.json wpt-manifest/
      - uses: actions/upload-artifact@v7
        with:
          name: wpt-manifest
          path: wpt-manifest/
          retention-days: 3

  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      # One job per binary so the three links overlap. Linking dominates the
      # wpt profile (~155 s of the ~236 s build step on one 4-core runner), and
      # a link cannot be split across cores, so serialising them is the cost.
      fail-fast: false
      matrix:
        include:
          # `output` is the file name the consuming job downloads;
          # `artifact` is the upload name, which stays per binary so a chunk
          # downloads only what it runs.
          - name: browser
            package: tinybrowser
            binary: tinybrowser
            output: tinybrowser-wpt
            artifact: tinybrowser-wpt
          - name: harness
            package: wpt-harness
            binary: wpt-harness
            output: wpt-harness
            artifact: wpt-harness-bin
          - name: fast
            package: wpt-fast
            binary: wpt-fast
            output: wpt-fast
            artifact: wpt-fast-bin
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq --no-install-recommends
          libfontconfig1-dev libssl-dev pkg-config
      - name: Toolchain
        run: |
          rustup toolchain install --profile minimal --component rust-src
          cargo --version
      - name: Submodules (build inputs only, shallow)
        run: |
          git submodule update --init --depth 1 --jobs 4 \
            third_party/blitz third_party/rquickjs third_party/html5ever
          git -C third_party/rquickjs submodule update --init --depth 1 sys/quickjs
      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"
      - name: Build
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: |
          # One package per job: the three links are the build's serial cost,
          # and each job renders only its own binary.
          cargo build --profile wpt --locked -p "${{ matrix.package }}"
          cp "$(./tools/binary-path --profile wpt "${{ matrix.binary }}")" \
            "${{ matrix.output }}"
          ls -l "${{ matrix.output }}"
      - name: Check runtime libraries
        if: ${{ matrix.name == 'harness' }}
        run: |
          missing="$(ldd "${{ matrix.output }}" | grep 'not found' || true)"
          if [[ -n "$missing" ]]; then
            echo "::error::missing runtime libraries in the runner image:"$'\n'"$missing"
            exit 1
          fi
      # One artifact per binary: a harness chunk needs 228 MB, not the 1.1 GB
      # bundle, and the WebDriver lane needs only the browser.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          retention-days: 3

  harness:
    name: harness chunk ${{ matrix.chunk }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.harness) }}
    steps:
      - uses: actions/checkout@v7
      - name: WPT checkout (pinned, shallow)
        run: git submodule update --init --depth 1 third_party/wpt
      - uses: astral-sh/setup-uv@v10.3.0
      - name: WPT revision
        id: wpt
        run: echo "rev=$(git -C third_party/wpt rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The venv is a tool install, not a verdict: same WPT revision and
      # Python, same install. `ensure_venv` re-checks its stamp and rebuilds a
      # stale cache instead of trusting it.
      - uses: actions/cache@v6
        with:
          path: third_party/wpt/_venv3
          key: wpt-venv-${{ runner.os }}-${{ steps.wpt.outputs.rev }}
      - uses: actions/download-artifact@v8
        with:
          name: wpt-harness-bin
      - uses: actions/download-artifact@v8
        with:
          name: wpt-manifest
          path: wpt-manifest
      - name: Shared manifest
        run: |
          if [[ -f wpt-manifest/MANIFEST.json ]]; then
            cp wpt-manifest/MANIFEST.json third_party/wpt/MANIFEST.json
          else
            echo "::error::no shared manifest; the plan job did not upload one"
            exit 1
          fi
      - name: Run chunk ${{ matrix.chunk }}
        env:
          REPORT: ${{ github.workspace }}/wpt-report-harness-${{ matrix.chunk }}.json
          RAW: ${{ github.workspace }}/wpt-harness-${{ matrix.chunk }}.log
        run: |
          set -euo pipefail
          chmod +x wpt-harness
          python3 tools/wpt/cli.py fast-harness / \
            --fast-binary "$PWD/wpt-harness" \
            --jobs 4 \
            --total-chunks "$WPT_HARNESS_CHUNKS" \
            --this-chunk "${{ matrix.chunk }}" \
            --exclude-testdriver \
            --report "$REPORT" 2>&1 | tee "$RAW"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: wpt-report-harness-${{ matrix.chunk }}
          path: wpt-report-harness-${{ matrix.chunk }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Raw log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wpt-raw-harness-${{ matrix.chunk }}
          path: wpt-harness-${{ matrix.chunk }}.log
          if-no-files-found: ignore
          retention-days: 3

  webdriver:
    name: webdriver chunk ${{ matrix.chunk }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.webdriver) }}
    steps:
      - uses: actions/checkout@v7
      - name: WPT checkout (pinned, shallow)
        run: git submodule update --init --depth 1 third_party/wpt
      - uses: astral-sh/setup-uv@v10.3.0
      - name: WPT revision
        id: wpt
        run: echo "rev=$(git -C third_party/wpt rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The venv is a tool install, not a verdict: same WPT revision and
      # Python, same install. `ensure_venv` re-checks its stamp and rebuilds a
      # stale cache instead of trusting it.
      - uses: actions/cache@v6
        with:
          path: third_party/wpt/_venv3
          key: wpt-venv-${{ runner.os }}-${{ steps.wpt.outputs.rev }}
      - uses: actions/download-artifact@v8
        with:
          name: tinybrowser-wpt
      - uses: actions/download-artifact@v8
        with:
          name: wpt-manifest
          path: wpt-manifest
      - name: Shared manifest
        run: |
          if [[ -f wpt-manifest/MANIFEST.json ]]; then
            cp wpt-manifest/MANIFEST.json third_party/wpt/MANIFEST.json
          else
            echo "::error::no shared manifest; the plan job did not upload one"
            exit 1
          fi
      - name: Run chunk ${{ matrix.chunk }}
        env:
          BINARY: ${{ github.workspace }}/tinybrowser-wpt
          REPORT: ${{ github.workspace }}/wpt-report-webdriver-${{ matrix.chunk }}.json
          RAW: ${{ github.workspace }}/wpt-report-webdriver-${{ matrix.chunk }}.raw.log
        run: |
          set -euo pipefail
          chmod +x "$BINARY"
          excludes=()
          for value in $WPT_EXCLUDE; do excludes+=("--exclude=$value"); done
          types=()
          for value in $WPT_TEST_TYPES; do types+=("$value"); done
          if (( ${#types[@]} == 0 )); then
            echo "::error::test-types is empty; nothing would run"
            exit 1
          fi
          python3 tools/wpt/cli.py run --binary "$BINARY" \
            --exclude-in-process -- \
            --no-manifest-update \
            --log-wptreport "$REPORT" \
            --log-raw "$RAW" \
            --no-fail-on-unexpected \
            --processes 4 \
            --total-chunks "$WPT_WEBDRIVER_CHUNKS" \
            --this-chunk "${{ matrix.chunk }}" \
            "${excludes[@]}" \
            --test-types "${types[@]}"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: wpt-report-webdriver-${{ matrix.chunk }}
          path: wpt-report-webdriver-${{ matrix.chunk }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Raw log (partial chunks still explain themselves)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wpt-raw-webdriver-${{ matrix.chunk }}
          path: wpt-report-webdriver-${{ matrix.chunk }}.raw.log
          if-no-files-found: ignore
          retention-days: 3

  test262:
    name: test262
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: WPT checkout (pinned, shallow)
        run: git submodule update --init --depth 1 third_party/wpt
      - uses: actions/download-artifact@v8
        with:
          name: wpt-fast-bin
      - name: Run test262
        env:
          REPORT: ${{ github.workspace }}/wpt-report-test262.json
        run: |
          set -euo pipefail
          chmod +x wpt-fast
          python3 tools/wpt/cli.py fast \
            --fast-binary "$PWD/wpt-fast" \
            --jobs 4 \
            --report "$REPORT"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: wpt-report-test262
          path: wpt-report-test262.json
          if-no-files-found: error
          retention-days: 7

  score:
    name: score
    needs: [plan, harness, webdriver, test262]
    if: ${{ !cancelled() && needs.harness.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wpt-report-*
          path: reports
          merge-multiple: true
      - name: Merge chunk reports
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(reports/*.json)
          expected=$(( WPT_HARNESS_CHUNKS + WPT_WEBDRIVER_CHUNKS + 1 ))
          echo "downloaded ${#reports[@]}/$expected chunk reports"
          if (( ${#reports[@]} == 0 )); then
            echo "::error::no chunk reports to merge"
            exit 1
          fi
          python3 tools/wpt/cli.py merge --strict-skips "${reports[@]}" \
            --out merged.json | tee summary.txt
          if (( ${#reports[@]} != expected )); then
            echo "::error::incomplete run: ${#reports[@]} of $expected chunk reports"
            exit 1
          fi
      - name: Run page summary
        if: ${{ !cancelled() && hashFiles('summary.txt') != '' }}
        run: |
          {
            printf '## WPT — %s (harness %s + webdriver %s chunks, exclude: %s)\n' \
              "$WPT_TEST_TYPES" "$WPT_HARNESS_CHUNKS" "$WPT_WEBDRIVER_CHUNKS" "$WPT_EXCLUDE"
            echo
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: wpt-merged
          path: |
            merged.json
            summary.txt
          if-no-files-found: warn
          retention-days: 7
