# Chunked WPT runs for sets too long for one machine. Local loops stay on
# tools/wpt/run; this workflow is the full-suite pass. Each run keeps its
# raw chunk reports as artifacts, so a score can be reproduced without
# rerunning anything.
#
# Shape: one build (stylo makes a cold build long) fans the same wpt-profile
# binary out to `chunks` jobs, and walks the test tree once (cli.py
# manifest) so chunk jobs can skip that walk. Each job runs one upstream
# dir_hash chunk of the shared manifest (wptrunner hashes the test
# directory, so a directory is never split across jobs); the score job folds
# the reports into one table on the run page. A chunk that died before
# writing its report is skipped there with a warning, turns the run red, and
# its raw log still says how far it got.
#
# Defaults: the four test types tinybrowser can run today (testharness,
# crashtest, reftest, test262) over the whole tree. print-reftest is out (no
# printing); aamtest and wdspec need pytest plus the platform accessibility
# stack, so they cannot run yet.
#
# Not here yet: results publishing (wpt-results branch + tracker page), PR
# subsets, wpt.fyi upload.
name: WPT

on:
  workflow_dispatch:
    inputs:
      chunks:
        description: Matrix size; mirrors upstream --total-chunks (1..256).
        type: string
        default: "20"
      test-types:
        description: Space-separated wptrunner test types; stays last (nargs).
        type: string
        default: "testharness crashtest reftest test262"
      exclude:
        description: Space-separated upstream --exclude values.
        type: string
        default: "worker"

permissions:
  contents: read

concurrency:
  # Queue, never cancel: a long run must not die because dispatch was hit
  # twice, and a cancelled run uploads no artifacts at all.
  group: wpt-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  # Line tables keep panic and crash backtraces usable (file:line) at a
  # fraction of full debuginfo; the 14 GB runner disk stays comfortable.
  CARGO_PROFILE_WPT_DEBUG: "line-tables-only"
  # Mirrors the flake devShell: link the runner's OpenSSL instead of building
  # a vendored copy (the vendored one needs perl and minutes, and links the
  # static copy where local builds link the system one).
  OPENSSL_NO_VENDOR: "1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - id: plan
        name: Build the chunk list
        env:
          CHUNKS: ${{ inputs.chunks }}
        run: |
          if [[ ! "$CHUNKS" =~ ^[1-9][0-9]*$ ]] || (( CHUNKS > 256 )); then
            echo "::error::chunks must be an integer in 1..256 (got '$CHUNKS')"
            exit 1
          fi
          echo "chunks=[$(seq -s, 1 "$CHUNKS")]" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq --no-install-recommends
          libfontconfig1-dev libssl-dev pkg-config
      - name: Submodules (build inputs only, shallow)
        run: |
          git submodule update --init --depth 1 --jobs 4 \
            third_party/blitz third_party/rquickjs third_party/html5ever
          # rquickjs needs its nested quickjs; html5ever's rcdom fixtures
          # are test data, so recursing into everything only costs time.
          git -C third_party/rquickjs submodule update --init --depth 1 sys/quickjs
      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Build the wpt profile
        run: |
          cargo build --profile wpt --locked
          cp "$(./tools/binary-path --profile wpt)" tinybrowser-wpt
          ls -l tinybrowser-wpt
      - name: Check runtime libraries
        run: |
          missing="$(ldd tinybrowser-wpt | grep 'not found' || true)"
          if [[ -n "$missing" ]]; then
            echo "::error::missing runtime libraries in the runner image:"$'\n'"$missing"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10.3.0
      - name: WPT manifest (built once for every chunk)
        run: |
          git submodule update --init --depth 1 third_party/wpt
          python3 tools/wpt/cli.py manifest
          mkdir -p wpt-manifest
          cp third_party/wpt/MANIFEST.json wpt-manifest/
          if compgen -G "$HOME/.cache/tinybrowser/wpt-manifest-*.stamp" > /dev/null; then
            cp "$HOME"/.cache/tinybrowser/wpt-manifest-*.stamp wpt-manifest/
          else
            echo "::warning::no manifest stamp; every chunk will walk the tree itself"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: tinybrowser-wpt
          path: tinybrowser-wpt
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: wpt-manifest
          path: wpt-manifest/
          retention-days: 3

  wpt:
    name: chunk ${{ matrix.chunk }}/${{ inputs.chunks }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v7
      - name: WPT checkout (pinned, shallow)
        run: git submodule update --init --depth 1 third_party/wpt
      # uv materializes CPython and the adapter venv on first use; the chunk
      # itself never compiles.
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/download-artifact@v8
        with:
          name: tinybrowser-wpt
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: wpt-manifest
          path: wpt-manifest
      - name: Shared manifest (skips the per-chunk tree walk)
        run: |
          if [[ -f wpt-manifest/MANIFEST.json ]]; then
            cp wpt-manifest/MANIFEST.json third_party/wpt/MANIFEST.json
          else
            echo "::warning::no shared manifest; this chunk walks the tree itself"
          fi
          mkdir -p "$HOME/.cache/tinybrowser"
          cp wpt-manifest/*.stamp "$HOME/.cache/tinybrowser/" 2>/dev/null \
            || echo "::warning::no manifest stamp; this chunk walks the tree itself"
      - name: Run chunk ${{ matrix.chunk }}
        # Deliberately below the job timeout: a step timeout fails the step
        # (later steps still run) instead of cancelling the job, and the
        # streaming raw log already holds everything the chunk finished.
        timeout-minutes: 135
        env:
          TINYBROWSER_BINARY: ${{ github.workspace }}/tinybrowser-wpt
          REPORT: ${{ github.workspace }}/wpt-report-${{ matrix.chunk }}.json
          RAW: ${{ github.workspace }}/wpt-report-${{ matrix.chunk }}.raw.log
          EXCLUDES: ${{ inputs.exclude }}
          TEST_TYPES: ${{ inputs.test-types }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          set -euo pipefail
          chmod +x "$TINYBROWSER_BINARY"
          excludes=()
          for value in $EXCLUDES; do excludes+=("--exclude=$value"); done
          types=()
          for value in $TEST_TYPES; do types+=("$value"); done
          if (( ${#types[@]} == 0 )); then
            echo "::error::test-types is empty; nothing would run"
            exit 1
          fi
          ./tools/wpt/run -- \
            --log-wptreport "$REPORT" \
            --log-raw "$RAW" \
            --no-fail-on-unexpected \
            --total-chunks "$CHUNKS" \
            --this-chunk "${{ matrix.chunk }}" \
            "${excludes[@]}" \
            --test-types "${types[@]}"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: wpt-report-${{ matrix.chunk }}
          path: wpt-report-${{ matrix.chunk }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Raw log (partial chunks still explain themselves)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wpt-raw-${{ matrix.chunk }}
          path: wpt-report-${{ matrix.chunk }}.raw.log
          if-no-files-found: ignore
          retention-days: 3

  score:
    name: score
    needs: [plan, wpt]
    if: ${{ !cancelled() && needs.wpt.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wpt-report-*
          path: reports
          merge-multiple: true
      - name: Merge chunk reports
        env:
          CHUNKS: ${{ inputs.chunks }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(reports/*.json)
          echo "downloaded ${#reports[@]}/$CHUNKS chunk reports"
          if (( ${#reports[@]} == 0 )); then
            echo "::error::no chunk reports to merge"
            exit 1
          fi
          # --strict-skips: an empty or truncated chunk report still lets the
          # table render, but turns the run red instead of hiding the chunk.
          python3 tools/wpt/cli.py merge --strict-skips "${reports[@]}" \
            --out merged.json | tee summary.txt
          if (( ${#reports[@]} != CHUNKS )); then
            echo "::error::incomplete run: ${#reports[@]} of $CHUNKS chunk reports"
            exit 1
          fi
      - name: Run page summary
        if: ${{ !cancelled() && hashFiles('summary.txt') != '' }}
        env:
          TEST_TYPES: ${{ inputs.test-types }}
          CHUNKS: ${{ inputs.chunks }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          {
            printf '## WPT — %s (%s chunks, exclude: %s)\n' \
              "$TEST_TYPES" "$CHUNKS" "$EXCLUDE"
            echo
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: wpt-merged
          path: |
            merged.json
            summary.txt
          if-no-files-found: warn
          retention-days: 7
