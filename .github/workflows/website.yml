# The public site: the home page and the WPT dashboard at /wpt.
#
# Two triggers, because the two inputs are independent:
#
#   push          the page changed; rebuild with whatever data is published.
#   workflow_run  a WPT run finished and may have pushed a new record to the
#                 results repo, so the page must be rebuilt with it.
#
# The dashboard reads the results repo at build time and copies the record into
# the site, so the deployed pages are a static snapshot; every file the page
# reads stays fetchable under /wpt/data.
#
# Deploy goes through Alchemy, which runs `bun run build` itself and uploads
# dist/ to Cloudflare. The stack refuses any stage but prod.

name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_run:
    workflows: [WPT]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a queued run waits rather than racing the upload.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WPT_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v7

      # The published history. A missing record is not an error: the site
      # renders its empty state and the first WPT run fills it in.
      - uses: actions/checkout@v7
        with:
          repository: tinybrowser-dev/tinybrowser-wpt-results
          path: data

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: website
        run: bunx alchemy deploy --stage prod --yes

      # Without the token there is nowhere to deploy yet, but the site still
      # builds so the push is checked and the log says why nothing shipped.
      - name: Build without deploying
        if: env.CLOUDFLARE_API_TOKEN == ''
        working-directory: website
        run: |
          bun run build
          echo "::notice::CLOUDFLARE_API_TOKEN is not set; the site built but was not deployed."
