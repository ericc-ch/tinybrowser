cargo-features = [
    # `[profile.release] rustflags` keeps release-only codegen shapes out of
    # dev/test links.
    "profile-rustflags",
]

[workspace]
exclude = ["third_party/rquickjs", "third_party/weedle4", "third_party/fontconfig-parser", "third_party/blitz", "third_party/html5ever"]
members = [
    "crates/anyrender-tiny-skia",
    "crates/browser",
    "crates/cdp",
    "crates/cookies",
    "crates/logging",
    "crates/net",
    "crates/renderer",
    "crates/server",
    "crates/webstorage",
    "crates/wasm",
    "crates/webdriver",
    "crates/webidl-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Erick Christian <erickchristian48@gmail.com>"]

[workspace.dependencies]
browser = { path = "crates/browser" }
cdp = { path = "crates/cdp" }
cookies = { path = "crates/cookies" }
logging = { path = "crates/logging" }
net = { path = "crates/net" }
renderer = { path = "crates/renderer" }
server = { path = "crates/server" }
webdriver = { path = "crates/webdriver" }
webstorage = { path = "crates/webstorage" }

[patch.crates-io]
# fontconfig-parser 0.5.8 pins roxmltree 0.20; usvg and fontique pin 0.21.
# The vendored crate is that release with the requirement moved to 0.21.1.
fontconfig-parser = { path = "third_party/fontconfig-parser" }
blitz-dom = { path = "third_party/blitz/packages/blitz-dom" }
blitz-html = { path = "third_party/blitz/packages/blitz-html" }
blitz-paint = { path = "third_party/blitz/packages/blitz-paint" }
blitz-traits = { path = "third_party/blitz/packages/blitz-traits" }
# The published 0.3.0-beta.4 predates the CopyStyleGetters trait the Stylo
# bump introduced; the vendored copy in the blitz fork has it, and renderer
# needs the trait to keep its direct clone_* calls compiling.
stylo_taffy = { path = "third_party/blitz/packages/stylo_taffy" }
# The xml5ever parser fork. It builds against registry markup5ever so the
# whole graph shares one atom/tendril/TreeSink type family.
xml5ever = { path = "third_party/html5ever/xml5ever" }
rquickjs = { path = "third_party/rquickjs" }
rquickjs-core = { path = "third_party/rquickjs/core" }
rquickjs-macro = { path = "third_party/rquickjs/macro" }
rquickjs-sys = { path = "third_party/rquickjs/sys" }

[package]
name = "tinybrowser"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
browser = { workspace = true }
cdp = { workspace = true }
webdriver = { workspace = true }
logging = { workspace = true }
serde_json = "1"
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
base64 = "0.23"

# ─── Lints ────────────────────────────────────────────────────────────────────
# Strict (not strict-strict): `all` is error, `pedantic`/`cargo` are warnings.
# No `nursery` (experimental). Suppressions are `#[expect]` with a reason, so a
# stale one fails the build instead of rotting; `allow_attributes_without_reason`
# keeps even the generated glue honest. Hand-written code has no `#[allow]`.
# `webidl-bindgen` still emits `#[allow(dead_code)]` on generated unions and
# enumerations: the same generated shape is used by some interfaces and unused
# by others, so an expectation would fail wherever an interface does use it.
# Usage-tracked emission is the follow-up that re-enables
# `allow_attributes = "deny"` (#136). The generator's other shapes — one
# dispatch function per member, borrowed union trials, merged identical arms —
# stopped triggering their lints instead of allowing them.
# `restriction` lints are denied individually (blanket is banned by clippy).
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
warnings = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
# Private single-binary repo, never published to crates.io; the metadata
# requirements (readme/keywords/categories/license) don't apply.
cargo_common_metadata = { level = "allow", priority = 1 }
# Duplicate crate versions are upstream transitive splits (syn 2/3,
# miniz_oxide via png/flate2, synstructure, num-bigint, embedded-io) that no
# bump removes without breaking a pin. Measured, not guessed, at every size
# checkpoint; see docs/size.md.
multiple_crate_versions = { level = "allow", priority = 1 }

# restriction: explicit, no blanket
todo = "deny"
unimplemented = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"
let_underscore_future = "deny"
unused_result_ok = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
mem_forget = "deny"
not_unsafe_ptr_arg_deref = "deny"
ptr_as_ptr = "deny"
ref_as_ptr = "deny"
transmute_ptr_to_ptr = "deny"
cast_ptr_alignment = "deny"
lossy_float_literal = "deny"
implicit_saturating_sub = "deny"
dbg_macro = "deny"
rc_mutex = "deny"
redundant_clone = "deny"
needless_collect = "deny"

# ─── Release profile ──────────────────────────────────────────────────────────
# The tuned profile from docs/size.md: every tuned marginal measured
# there assumes exactly these flags. Lives here so any measurement in the doc
# reproduces verbatim (`cargo build --release`, no env overrides).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# No unwinder runs (abort panics, QuickJS uses setjmp), so no function needs
# unwind tables. Emitting none at codegen beats deleting them post-link: the
# bytes are never produced. The panic hook still runs (see logging).
rustflags = ["-C", "force-unwind-tables=no"]

# `[unstable] build-std` applies to every profile. In dev/test that means std
# is built at `opt-level = 0` instead of the toolchain's release-optimized
# prebuilt std, which measurably slowed the suite: `cargo test -p renderer`
# went from 13.85s to 24.9s. Optimize the four crates std owns; our crates and
# dependencies keep the dev profile's settings so compiles stay fast.
[profile.dev.package.std]
opt-level = 2
[profile.dev.package.core]
opt-level = 2
[profile.dev.package.alloc]
opt-level = 2
[profile.dev.package.panic_abort]
opt-level = 2

# ─── WPT profile ──────────────────────────────────────────────────────────────
# Conformance runs measure the engine against testharness file timeouts. A
# debug build spends that budget inside a `-O0` QuickJS interpreter, so slow
# matrix files time out on the build mode instead of the engine. Keep dev's
# assertions and overflow checks, optimize the code.
[profile.wpt]
inherits = "dev"
opt-level = 2
