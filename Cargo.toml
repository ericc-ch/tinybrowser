[workspace]
members = [
    "crates/browser",
    "crates/cdp",
    "crates/cookies",
    "crates/dom",
    "crates/logging",
    "crates/net",
    "crates/render",
    "crates/renderer",
    "crates/server",
    "crates/wasm",
    "crates/webdriver",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
browser = { path = "crates/browser" }
cdp = { path = "crates/cdp" }
cookies = { path = "crates/cookies" }
dom = { path = "crates/dom" }
logging = { path = "crates/logging" }
net = { path = "crates/net" }
render = { path = "crates/render" }
renderer = { path = "crates/renderer" }
server = { path = "crates/server" }
webdriver = { path = "crates/webdriver" }

[package]
name = "tinybrowser"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
browser = { workspace = true }
cdp = { workspace = true }
webdriver = { workspace = true }
logging = { workspace = true }
serde_json = "1"
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
base64 = "0.23"

# ─── Lints ────────────────────────────────────────────────────────────────────
# Strict (not strict-strict): `all` is error, `pedantic`/`cargo` are warnings.
# No `nursery` (experimental). No `allow` list: fix code instead of silencing.
# `restriction` lints are denied individually (blanket is banned by clippy).
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
warnings = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Private single-binary repo, never published to crates.io; the metadata
# requirements (readme/keywords/categories/license) don't apply.
cargo_common_metadata = { level = "allow", priority = 1 }
# Duplicate crate versions come from deliberate dependency pins (the html5ever
# name stack: web_atoms via markup5ever =0.39.0 with phf 0.13, blocked on
# stylo publishing web_atoms-0.3 support; hyper-util keeping upstream
# base64 0.22 next to the direct 0.23) plus upstream transitive splits
# (miniz_oxide via png/flate2, syn 2/3) that no bump removes without
# breaking a pin. Measured, not guessed, at every size checkpoint; see
# docs/researches/size-budget.md.
multiple_crate_versions = { level = "allow", priority = 1 }

# restriction: explicit, no blanket
todo = "deny"
unimplemented = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"
let_underscore_future = "deny"
unused_result_ok = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
mem_forget = "deny"
not_unsafe_ptr_arg_deref = "deny"
ptr_as_ptr = "deny"
ref_as_ptr = "deny"
transmute_ptr_to_ptr = "deny"
cast_ptr_alignment = "deny"
lossy_float_literal = "deny"
implicit_saturating_sub = "deny"
dbg_macro = "deny"
rc_mutex = "deny"
redundant_clone = "deny"
needless_collect = "deny"

# ─── Release profile ──────────────────────────────────────────────────────────
# The tuned profile from docs/researches/size-budget.md: every tuned marginal measured
# there assumes exactly these flags. Lives here so any measurement in the doc
# reproduces verbatim (`cargo build --release`, no env overrides).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
